name: Bug report
description: Something does not work as it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options:
        - Pocket Workshop
        - Portable Crafting Table
        - Four Elemental Swords
        - Elemental Power
        - Tools Of Obsidian
        - One Punch Man
        - Tablets
        - Growing Items
        - Ore Revolution
        - Transmutation Ore
        - Seeds From All Dirt Blocks
        - Remove Potions Icons
        - Craftable Enchanted Books
        - Craft the Totem of Undying
        - Craft Saddles
        - Craftable Chainmail Armor
        - Craftable Saplings
        - Easy Netherite Ingot
        - Easy Emerald
        - Easy Diamond
        - More Decorative Blocks
        - More Buttons
        - More Carpets
        - More Doors
        - "More Fences & Gates"
        - More Ladders
        - More Pressure Plates
        - More Slabs
        - More Stairs
        - More Trapdoors
        - More Vertical Slabs
        - More Walls
        - BlackwolfLibrary
        - OreLibrary
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Mod version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: Minecraft version
      placeholder: "26.1.2"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Forge
        - NeoForge
        - Fabric
    validations:
      required: true
  - type: input
    id: loader_version
    attributes:
      label: Loader version
  - type: dropdown
    id: side
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer server
        - Both
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: Paste a link (mclo.gs, pastebin, gist) to latest.log or the crash report. Please do not paste the whole file here.
  - type: textarea
    id: other_mods
    attributes:
      label: Other mods installed
      description: If the problem only happens with other mods, list them or name the modpack.
