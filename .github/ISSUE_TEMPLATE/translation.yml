    attributes:
      label: Mod
      options:
        - Pocket Workshop
        - Portable Crafting Table
        - Four Elemental Swords
        - Elemental Power
        - Tools Of Obsidian
        - One Punch Man
        - Tablets
        - Growing Items
        - Ore Revolution
        - Transmutation Ore
        - Seeds From All Dirt Blocks
        - Remove Potions Icons
        - Craftable Enchanted Books
        - Craft the Totem of Undying
        - Craft Saddles
        - Craftable Chainmail Armor
        - Craftable Saplings
        - Easy Netherite Ingot
        - Easy Emerald
        - Easy Diamond
        - More Decorative Blocks
        - More Buttons
        - More Carpets
        - More Doors
        - "More Fences & Gates"
        - More Ladders
        - More Pressure Plates
        - More Slabs
        - More Stairs
        - More Trapdoors
        - More Vertical Slabs
        - More Walls
        - BlackwolfLibrary
        - OreLibrary
    validations:
      required: true
  - type: input
    id: language
