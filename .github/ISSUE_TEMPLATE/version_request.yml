name: Version or loader request
description: Ask for a mod on another Minecraft version or mod loader
title: "[Request] "
labels: ["version request"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options:
        - Pocket Workshop
        - Portable Crafting Table
        - Four Elemental Swords
        - Elemental Power
        - Tools Of Obsidian
        - One Punch Man
        - Tablets
        - Growing Items
        - Ore Revolution
        - Transmutation Ore
        - Seeds From All Dirt Blocks
        - Remove Potions Icons
        - Craftable Enchanted Books
        - Craft the Totem of Undying
        - Craft Saddles
        - Craftable Chainmail Armor
        - Craftable Saplings
        - Easy Netherite Ingot
        - Easy Emerald
        - Easy Diamond
        - More Decorative Blocks
        - More Buttons
        - More Carpets
        - More Doors
        - "More Fences & Gates"
        - More Ladders
        - More Pressure Plates
        - More Slabs
        - More Stairs
        - More Trapdoors
        - More Vertical Slabs
        - More Walls
        - BlackwolfLibrary
        - OreLibrary
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: Minecraft version you need
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Forge
        - NeoForge
        - Fabric
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: For example the modpack you need it for.
